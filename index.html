<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScanExpress V1.1</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script><style>*{box-sizing:border-box}body{background:#091524;color:#eef6ff;font:16px system-ui;margin:auto;max-width:720px;padding:18px}h1{color:#38bdf8;font-style:italic;margin-bottom:0}section{background:#172b40;padding:16px;border-radius:16px;margin:15px 0}button,.file{display:block;width:100%;padding:14px;margin:8px 0;border:0;border-radius:10px;background:linear-gradient(#2586ce,#12558c);color:white;font-weight:bold;cursor:pointer;box-shadow:0 4px #092c49;text-align:center}input,textarea,select{width:100%;padding:10px;border-radius:8px;border:1px solid #65829a;margin:5px 0 12px;font:inherit}textarea{min-height:90px}label{display:block}input[type=checkbox]{width:auto}small{color:#b6c9da}img{max-width:100%;max-height:260px}article{border-top:1px solid #456;padding:12px 0;overflow-wrap:anywhere}article button{display:inline-block;width:auto;margin-right:8px}#print{display:none}@media print{body{margin:0;padding:0;background:white;color:black;max-width:none}#app{display:none}#print{display:flex;color:black;align-items:center;overflow:hidden;break-inside:avoid;font-family:Arial}#print strong{width:35%;text-align:center;border-right:1px solid black;overflow-wrap:anywhere}#print div{width:65%;padding:2mm;overflow-wrap:anywhere}}</style><div id="app"><h1>ScanExpress</h1><small>V1.1 • Escaneie. Organize. Entregue.</small><section><h2 id="stats"></h2><button id="live">Iniciar scanner contínuo</button><div id="view" hidden style="position:relative"><video id="video" playsinline muted style="width:100%"></video><div style="position:absolute;inset:20% 5%;border:3px solid #4ade80;pointer-events:none"></div></div><button id="stop" hidden>Parar scanner</button><label><input type="checkbox" id="crop" checked> Ler somente área central da câmera</label><label class="file">📷 Fotografar etiqueta (alternativa)<input id="camera" type="file" accept="image/*" capture="environment"></label><label class="file">Importar fotografia<input id="photo" type="file" accept="image/*"></label><p id="status" role="status"></p><img id="preview" hidden><label>Texto reconhecido (confira o destinatário)<textarea id="raw" readonly></textarea></label><button id="retry">Limpar leitura e tentar novamente</button><button id="extract">Tentar identificar endereço</button><label>Transportadora<select id="carrier"><option value="">Não identificada</option><option>iMile</option><option>J&T Express</option><option>Outra</option></select></label><label>Rastreamento<input id="tracking"></label><label>Endereço completo do destinatário<textarea id="address" placeholder="Rua, número, complemento, bairro, cidade, UF, CEP"></textarea></label><button id="save">Confirmar e cadastrar pacote</button></section><section><h2>Impressão horizontal</h2><label>Largura (mm)<input id="width" type="number" min="30" max="150" value="100"></label><label>Altura (mm)<input id="height" type="number" min="20" max="150" value="50"></label><label>Fonte Sequence (pt)<input id="seqfont" type="number" min="12" max="100" value="60"></label><label>Fonte endereço (pt)<input id="addrfont" type="number" min="6" max="30" value="12"></label><label><input id="auto" type="checkbox"> Abrir impressão após cadastro</label><label><input id="voice" type="checkbox" checked> Anunciar número por voz</label></section><section><h2>Entregas</h2><label>Formato XLSX<select id="format"><option value="simple">Ordem + Endereço completo</option><option value="rota">Sequence + Destination Address + SPX TN</option></select></label><button id="export">Exportar Excel (.xlsx)</button><div id="list"></div><button id="reset">Iniciar nova lista</button></section></div><div id="print"></div><style id="page"></style><script>
const $=id=>document.getElementById(id);let state;try{state=JSON.parse(localStorage.getItem('scanexpress-v1'))||{next:1,items:[]}}catch(e){state={next:1,items:[]}}let busy=false,editing=null;const settings=['width','height','seqfont','addrfont','auto','voice','format'];try{const s=JSON.parse(localStorage.getItem('scanexpress-settings')||'{}');settings.forEach(k=>{if(k in s){if($(k).type==='checkbox')$(k).checked=s[k];else $(k).value=s[k]}})}catch(e){}settings.forEach(k=>$(k).onchange=()=>{try{localStorage.setItem('scanexpress-settings',JSON.stringify(Object.fromEntries(settings.map(k=>[k,$(k).type==='checkbox'?$(k).checked:$(k).value]))))}catch(e){alert('Não foi possível salvar configurações')}});function persist(next){try{localStorage.setItem('scanexpress-v1',JSON.stringify(next));state=next;return true}catch(e){alert('Falha ao salvar. Cadastro não alterado.');return false}}function say(t){if($('voice').checked&&window.speechSynthesis){let u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';speechSynthesis.speak(u)}}function render(){$('stats').textContent=`${state.items.length} pacotes • Próxima Sequence: ${state.next}`;$('list').replaceChildren();state.items.forEach(p=>{let a=document.createElement('article'),t=document.createElement('div');t.textContent=`#${p.seq} — ${p.address} | ${p.carrier} ${p.tracking}`;a.append(t);for(const [name,fn] of [['Imprimir',()=>printLabel(p)],['Editar',()=>{editing=p.seq;$('address').value=p.address;$('carrier').value=p.carrier;$('tracking').value=p.tracking;$('save').textContent='Salvar correção #'+p.seq;window.scrollTo(0,0)}],['Excluir',()=>{if(confirm('Excluir pacote '+p.seq+'? O número não será reutilizado.')){if(persist({...state,items:state.items.filter(x=>x.seq!==p.seq)}))render()}}]]){let b=document.createElement('button');b.textContent=name;b.onclick=fn;a.append(b)}$('list').append(a)})}function clearForm(){editing=null;for(let k of ['address','tracking','raw','camera','photo'])$(k).value='';$('carrier').value='';$('preview').hidden=true;$('save').textContent='Confirmar e cadastrar pacote'}function extract(){let t=$('raw').value,lines=t.split(/\n/).map(x=>x.trim()).filter(Boolean);if(/imile/i.test(t))$('carrier').value='iMile';else if(/j\s*&\s*t/i.test(t))$('carrier').value='J&T Express';let start=lines.findIndex(x=>/destinat[aá]rio|recipient|receiver|entregar a|^TO\b/i.test(x));let pool=start>=0?lines.slice(start+1):lines;let end=pool.findIndex(x=>/remetente|sender|tiktok shop|peso|qntd/i.test(x));if(end>=0)pool=pool.slice(0,end);let i=pool.findIndex(x=>/\b(rua|avenida|av\.|travessa|alameda|estrada|rodovia)\b/i.test(x));let out=[];if(i>=0){if(i>0&&/conjunto|bairro|jardim/i.test(pool[i-1]))i--;for(let l of pool.slice(i,i+6)){out.push(l);if(/\b\d{5}[- ]?\d{3}\b/.test(l))break}}let addr=out.join(' ').replace(/(\d)\s+(\d{2})(?=,)/g,'$1$2');if(addr)$('address').value=addr;$('status').textContent=addr?'Confira o endereço antes de confirmar.':'Endereço não reconhecido. Aproxime a área do destinatário.';return !!addr} $('extract').onclick=extract;
let stream=null,worker=null,timer=null,generation=0,detector=null;try{if(window.BarcodeDetector)detector=new BarcodeDetector()}catch(e){};
async function recognize(c){if(!worker){worker=await Tesseract.createWorker('por',1,{logger:m=>{$('status').textContent=m.status+' '+Math.round((m.progress||0)*100)+'%'}})}await worker.setParameters({tessedit_pageseg_mode:'6',user_defined_dpi:'300'});let p=document.createElement('canvas');let scale=Math.min(3,Math.max(1,1800/c.width),3000/Math.max(c.width,c.height));p.width=Math.round(c.width*scale);p.height=Math.round(c.height*scale);let ctx=p.getContext('2d');ctx.filter='grayscale(1) contrast(1.35)';ctx.drawImage(c,0,0,p.width,p.height);let r=await worker.recognize(p);return r.data.text}
async function codes(c){try{if(detector){let arr=await detector.detect(c);let q=arr.find(x=>x.format==='qr_code'&&/^\d{8,30}$/.test(x.rawValue))||arr.find(x=>/^\d{10,20}$/.test(x.rawValue));if(q)return q.rawValue}if(window.jsQR){let d=c.getContext('2d').getImageData(0,0,c.width,c.height),q=jsQR(d.data,d.width,d.height);if(q&&/^\d{8,30}$/.test(q.data.trim()))return q.data.trim()}}catch(e){}return ''}
async function process(c,live=false){if(busy)return;busy=true;$('save').disabled=true;let g=generation;try{let code=await codes(c);if(code&&g===generation)$('tracking').value=code;let target=c;if(live&&$('crop').checked){target=document.createElement('canvas');target.width=Math.round(c.width*.9);target.height=Math.round(c.height*.6);target.getContext('2d').drawImage(c,c.width*.05,c.height*.2,target.width,target.height,0,0,target.width,target.height)}let text=await recognize(target);if(g!==generation)return;$('raw').value=text;let found=extract();if(found&&live){clearTimeout(timer);$('status').textContent='Confira o endereço e confirme. Scanner aguardando.'}}catch(e){$('status').textContent='Falha OCR: '+e.message}finally{busy=false;$('save').disabled=false;if(stream&&!$('address').value.trim())schedule()}}
function schedule(){clearTimeout(timer);if(stream)timer=setTimeout(tick,900)}function tick(){let v=$('video');if(!stream)return;if(busy||!v.videoWidth){schedule();return}if($('address').value.trim())return;let c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);process(c,true)}
function stop(){generation++;clearTimeout(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;$('view').hidden=true;$('stop').hidden=true;$('live').hidden=false} $('stop').onclick=stop;$('retry').onclick=()=>{if(busy)return;clearForm();if(stream)schedule()};$('live').onclick=async()=>{try{if(!navigator.mediaDevices)throw Error('Abra pelo HTTPS');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});clearForm();$('video').srcObject=stream;await $('video').play();$('view').hidden=false;$('stop').hidden=false;$('live').hidden=true;schedule()}catch(e){stop();$('status').textContent='Câmera: '+e.message}};
async function scan(file){if(!file||busy)return;stop();clearForm();let url=URL.createObjectURL(file);try{let im=new Image();im.src=url;await im.decode();let c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);$('preview').src=c.toDataURL('image/jpeg',.8);$('preview').hidden=false;await process(c)}catch(e){$('status').textContent=e.message}finally{URL.revokeObjectURL(url)}}for(let k of ['camera','photo'])$(k).onchange=e=>scan(e.target.files[0]);
$('save').onclick=()=>{if(busy)return;let address=$('address').value.trim(),tracking=$('tracking').value.trim(),carrier=$('carrier').value;if(!address)return alert('Informe o endereço do destinatário.');let duplicate=tracking&&state.items.find(p=>p.seq!==editing&&p.tracking===tracking&&(!carrier||!p.carrier||p.carrier===carrier));if(duplicate){say('Atenção, pacote já cadastrado número '+duplicate.seq);if(confirm('Pacote já cadastrado #'+duplicate.seq+'. Reimprimir?'))printLabel(duplicate);return}if(!tracking&&!confirm('Rastreamento não identificado. Confirma que este é outro pacote?'))return;let p={seq:editing??state.next,address,tracking,carrier};let next=editing?{...state,items:state.items.map(x=>x.seq===editing?p:x)}:{next:state.next+1,items:[...state.items,p]};if(!persist(next))return;clearForm();render();say('Pacote número '+p.seq+' salvo');if($('auto').checked)printLabel(p);if(stream)schedule()};function printLabel(p){let num=(k,min,max,def)=>Math.max(min,Math.min(max,Number($(k).value)||def)),w=num('width',30,150,100),h=num('height',20,150,50);$('page').textContent=`@page{size:${w}mm ${h}mm;margin:0} @media print{#print{width:${w}mm;height:${h}mm}}`;let s=document.createElement('strong');s.style.fontSize=num('seqfont',12,100,60)+'pt';s.textContent=p.seq;let d=document.createElement('div');d.style.fontSize=num('addrfont',6,30,12)+'pt';d.textContent=p.address;$('print').replaceChildren(s,d);window.print()}$('export').onclick=()=>{if(!state.items.length)return alert('Nenhum pacote cadastrado');if(!window.XLSX)return alert('Biblioteca Excel indisponível. Verifique a internet.');let rota=$('format').value==='rota',rows=state.items.map(p=>rota?{'Sequence':p.seq,'Destination Address':p.address,'SPX TN':p.tracking}:{'Ordem':p.seq,'Endereço completo':p.address});let wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(rows);ws['!cols']=[{wch:12},{wch:85},{wch:25}];XLSX.utils.book_append_sheet(wb,ws,'Entregas');XLSX.writeFile(wb,'ScanExpress-entregas.xlsx')};$('reset').onclick=()=>{if(confirm('Iniciar nova lista? Exporte a lista atual antes. Todos os cadastros atuais serão apagados.'))if(persist({next:1,items:[]})){clearForm();render()}};render();</script></html>
